[workspace]
resolver = "2"
members = [
  "crates/sismatic-api-types",
  "crates/sismatic-cli",
  "crates/sismatic-core",
  "crates/sismatic-http-api",
  "crates/sismatic-python-sdk",
  "crates/sismatic-server",
  "crates/sismatic-store",
  "crates/sismatic-store-memory",
  "crates/sismatic-sync",
  "crates/sismatic-web/backend",
]

# Shared across every member so a version/edition/license bump happens once.
[workspace.package]
version = "0.2.22"
edition = "2024"
license = "ECL-2.0"

# Single source of truth for dependency versions. Members opt in with
# `foo.workspace = true` and add only the extra features they need, so e.g. the
# web tree never leaks into the wheel build and pyo3 never leaks into the CLI.
[workspace.dependencies]
# Internal. The `version` is required (not just `path`) so that `cargo package`
# succeeds under release-plz's `git_only` mode — packaging a crate errors if a
# path dependency omits a version. release-plz keeps this in lockstep with the
# workspace version on every bump.
sismatic-core = { path = "crates/sismatic-core", version = "0.2.22" }
# The wire contract. Shared by the (future) http-api and api-client; depends on
# nothing internal, so it never widens any consumer's dependency cone.
sismatic-api-types = { path = "crates/sismatic-api-types", version = "0.2.22" }

# Shared third-party
# The read side's HTTP framework. `default-features = false` drops the response
# compressors (brotli/gzip/zstd), cookies, HTTP/2 and the routing macros — none
# of which this API uses — so the read side's dependency cone stays close to the
# framework itself rather than pulling a compression toolchain into every build
# and every license audit. Turn a feature back on in the member that needs it.
actix-web = { version = "4.13", default-features = false }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dashmap = "6.2.1"
# `abi3-py39` builds against CPython's stable ABI, so one wheel covers 3.9+
# instead of one wheel per interpreter version. (3.9 is the floor because the
# Python facade takes weak references to `Sis`, which `abi3` only supports from
# 3.9 on; 3.8 has been EOL since October 2024.)
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py39"] }
# Bridges Rust's `log` output (russh emits the SSH handshake + auth negotiation
# here) into Python's `logging`, so callers can debug connection failures with
# `logging.basicConfig(level=logging.DEBUG)`. 0.13.4 is the first release whose
# pyo3 range (`>=0.26, <0.30`) covers our pyo3 0.29.
pyo3-log = "0.13.4"
# serde bridge between a live Python object and a serde `Deserialize` type, so
# `Sis.from_config` can turn any parsed `dict` into a `RawConfig`. Versioned in
# lockstep with pyo3, so 0.29 matches our pyo3 0.29.
pythonize = "0.29.0"
# Test-only HTTP client: the http-api's integration tests drive the real server
# over a real socket rather than through the framework's in-process test
# harness, so what they exercise is the response an operator's probe sees.
# `default-features = false` drops the TLS stacks (and the system
# proxy/keychain lookups behind them); the tests only ever talk to loopback.
reqwest = { version = "0.12", default-features = false }
russh = "0.60.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Strongly typed YAML deserializer (import path: `serde_saphyr`); the maintained
# path forward now that `serde_yaml` is deprecated.
serde-saphyr = "0.0.29"
tokio = { version = "1" }
# Cancellation tokens for the `sismatic-sync` driver's cooperative shutdown; only
# pulled in under that crate's `driver` feature.
tokio-util = { version = "0.7", features = ["rt"] }
# RFC-3339 wall-clock timestamps for the readings the sync driver persists. The
# `clock` feature enables `Utc::now()`; no other default features are needed.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "0.8"
# Optional in `sismatic-api-types` (feature `ts`): emit TypeScript definitions
# from the DTOs so the web frontend shares one source of truth for JSON shapes.
ts-rs = "12"
winnow = "1.0.3"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = [
  "registry",
  "env-filter",
] }
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
secrecy = { version = "0.10.3", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
