[workspace]
resolver = "2"
members = [
  "crates/sismatic-api-types",
  "crates/sismatic-cli",
  "crates/sismatic-core",
  "crates/sismatic-http-api",
  "crates/sismatic-python-sdk",
  "crates/sismatic-server",
  "crates/sismatic-store",
  "crates/sismatic-store-memory",
  "crates/sismatic-sync",
  "crates/sismatic-intent-relay",
]

# Shared across every member so a version/edition/license bump happens once.
[workspace.package]
version = "0.3.1"
edition = "2024"
license = "ECL-2.0"

# Single source of truth for dependency versions. Members opt in with
# `foo.workspace = true` and add only the extra features they need, so e.g. the
# web tree never leaks into the wheel build and pyo3 never leaks into the CLI.
[workspace.dependencies]
# Internal crates. The `version` next to the `path` is mandatory even though
# none of these is ever published: release-plz runs in `git_only` mode, which
# packages the *whole* workspace (`cargo package --allow-dirty --workspace`, in a
# worktree checked out at the last release tag) to diff each member against its
# last release, and cargo refuses to package any crate whose path dependency
# carries no version requirement — "all dependencies must have a version
# requirement specified when packaging". Dropping these to path-only is what
# broke the v0.2.24 release; `release = false` in release-plz.toml does not
# exempt a member, because `--workspace` has no per-package filter.
#
# `"0"` — not the workspace version — is the requirement, and the distinction is
# the whole point. `^0` matches every 0.x, so there is nothing here to keep in
# lockstep and nothing to rot; release-plz's `upgrade_requirement` only reassigns
# the components a requirement spells out, so `0` rewrites to `0`, compares
# equal, and is left alone. Every bump therefore lands in exactly one place —
# `[workspace.package] version` above — which the members inherit. (At a 1.0
# bump release-plz rewrites these to `1` on its own, which is what we'd want.)
#
# So do not "tidy" these into exact pins. Exact pins are the older design and
# they rotted: release-plz maintains only the pins of packages it actually
# releases, so `sismatic-api-types` sat at 0.2.19 against a 0.2.20 workspace,
# and cargo's caret rule hid it until the next release broke. And do not drop
# the `version` again — that is the failure above.
sismatic-api-types = { path = "crates/sismatic-api-types", version = "0" }
sismatic-core = { path = "crates/sismatic-core", version = "0" }
sismatic-http-api = { path = "crates/sismatic-http-api", version = "0" }
sismatic-intent-relay = { path = "crates/sismatic-intent-relay", version = "0" }
sismatic-store = { path = "crates/sismatic-store", version = "0" }
sismatic-store-memory = { path = "crates/sismatic-store-memory", version = "0" }
sismatic-sync = { path = "crates/sismatic-sync", version = "0" }

# Shared third-party
# The read side's HTTP framework. `default-features = false` drops the response
# compressors (brotli/gzip/zstd), cookies, HTTP/2 and the routing macros — none
# of which this API uses — so the read side's dependency cone stays close to the
# framework itself rather than pulling a compression toolchain into every build
# and every license audit. Turn a feature back on in the member that needs it.
#
# This line is now the whole story. It used to leak one feature back:
# `utoipa-swagger-ui` declared actix-web with `macros`, and cargo unifies
# features across the graph, so the routing macros were compiled whether or not
# a handler used them. The Scalar crate that replaced it is taken without its
# `actix-web` feature — see `scalar_api_reference` below — so nothing in the
# graph asks actix-web for a feature any more and `actix-web-codegen` is no
# longer built at all. Check with `cargo tree -e features -i actix-web`: the
# edge into `sismatic-http-api` should be the only one, unmarked.
actix-web = { version = "4.13", default-features = false }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dashmap = "6.2.1"
# `abi3-py39` builds against CPython's stable ABI, so one wheel covers 3.9+
# instead of one wheel per interpreter version. (3.9 is the floor because the
# Python facade takes weak references to `Sis`, which `abi3` only supports from
# 3.9 on; 3.8 has been EOL since October 2024.)
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py39"] }
# Bridges Rust's `log` output (russh emits the SSH handshake + auth negotiation
# here) into Python's `logging`, so callers can debug connection failures with
# `logging.basicConfig(level=logging.DEBUG)`. 0.13.4 is the first release whose
# pyo3 range (`>=0.26, <0.30`) covers our pyo3 0.29.
pyo3-log = "0.13.4"
# serde bridge between a live Python object and a serde `Deserialize` type, so
# `Sis.from_config` can turn any parsed `dict` into a `RawConfig`. Versioned in
# lockstep with pyo3, so 0.29 matches our pyo3 0.29.
pythonize = "0.29.0"
# Test-only HTTP client: the http-api's integration tests drive the real server
# over a real socket rather than through the framework's in-process test
# harness, so what they exercise is the response an operator's probe sees.
# `default-features = false` drops the TLS stacks (and the system
# proxy/keychain lookups behind them); the tests only ever talk to loopback.
reqwest = { version = "0.12", default-features = false }
russh = "0.60.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Strongly typed YAML deserializer (import path: `serde_saphyr`); the maintained
# path forward now that `serde_yaml` is deprecated.
serde-saphyr = "0.0.29"
tokio = { version = "1" }
# Cancellation tokens for the `sismatic-sync` driver's cooperative shutdown; only
# pulled in under that crate's `driver` feature.
tokio-util = { version = "0.7", features = ["rt"] }
# RFC-3339 wall-clock timestamps for the readings the sync driver persists. The
# `clock` feature enables `Utc::now()`; no other default features are needed.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "0.8"
# Optional in `sismatic-api-types` (feature `ts`): emit TypeScript definitions
# from the DTOs so the web frontend shares one source of truth for JSON shapes.
ts-rs = "12"
# OpenAPI, derived from the same structs `serde` derives from. The point is that
# the document cannot describe a shape the server does not serve: rename a field
# and the schema renames with it, because both come off one `#[derive]`. A
# hand-written openapi.yaml is a second source of truth that is only ever checked
# by a human noticing.
#
# Optional in `sismatic-api-types` (feature `openapi`) for the same reason
# `ts-rs` is: the wire contract stays a serde-only crate for anyone who wants
# nothing but the DTOs, and a plain build never compiles the proc-macro tree.
utoipa = { version = "5.5", features = ["macros"] }
# Where the Scalar API reference bundle comes from — no CDN, no static-file
# deployment step, and the docs a server shows are the docs that server was
# built with.
#
# Scalar's own Rust crate rather than `utoipa-scalar`, and the reason is the
# property above: `utoipa-scalar` ships an HTML shell whose one `<script>` points
# at jsdelivr, so its page is blank on a host with no route off the LAN — which
# is the normal case for the installations this serves. This crate carries
# `ui/scalar.js` inside the `.crate` file, so the bundle is pinned in the
# lockfile like any other dependency and no build step ever reaches the network.
#
# A *build*-dependency, which is the whole of how it is used: `sismatic-http-api`'s
# build script asks it for the bundle once, compresses it, and embeds the result.
# Nothing links it at runtime — see that crate's manifest for what that keeps out
# of the shipped binary, and `src/openapi.rs` for why the bundle is stored
# compressed at all.
#
# No features either way. The crate's `actix-web` feature is a four-line
# `ServiceConfig` helper, and it declares actix-web *with* default features —
# cargo unifies those across the graph, so taking the helper would undo the
# narrowing above and compile the compressors, cookies and HTTP/2 back into every
# build. The routes are four lines in `startup`; the feature is not worth its
# blast radius.
scalar_api_reference = { version = "0.2.2", default-features = false }
# gzip, both ends of it: the build script compresses the Scalar bundle, and the
# one handler that serves it inflates again for the rare client that refuses a
# compressed response. `rust_backend` is the pure-Rust deflate (miniz_oxide);
# the alternative backends bind to a system zlib, which would put a C toolchain
# and a native library on the path of a build that has neither.
flate2 = { version = "1", default-features = false, features = [
  "rust_backend",
] }
winnow = "1.0.3"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = [
  "registry",
  "env-filter",
] }
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
secrecy = { version = "0.10.3", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
