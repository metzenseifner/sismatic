[package]
name = "sismatic-server"
description = "Sismatic Server is a composition root."
version.workspace = true
edition.workspace = true
license.workspace = true
# The composition-root binary: internal, published nowhere (release-plz.toml
# already carries `release = false` for it). The flag is not merely
# documentation — it is load-bearing. `cargo publish --workspace` skips
# `publish = false` members, and the members it skips are also absent from the
# local overlay that satisfies the other members' path+version deps. So a
# *publishable* crate may not depend on an unpublishable one: cargo strips the
# `path`, resolves the leftover `version` against crates.io, and fails with
# "no matching package named `sismatic-http-api` found". Marking this crate
# unpublishable pulls it out of the publish set entirely, which is the only way
# it may keep depending on `sismatic-http-api` (itself `publish = false`).
# Invariant: publish = false is contagious upward — every crate that depends on
# an unpublished crate must be unpublished too.
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "sismatic-server"

[dependencies]

# `toml`/`yaml` give the composition root core's extension-dispatching
# `config::load`, so `devices_config_path` may name either format.
sismatic-core = { workspace = true, features = ["ssh", "toml", "yaml"] }
# Named directly for one type: the `Timestamp` the write side's `Stamp` mints.
# It already arrives transitively through every other internal crate here; the
# explicit edge is so the root does not depend on that being true.
sismatic-api-types = { workspace = true }
sismatic-http-api = { workspace = true }
sismatic-store = { workspace = true }
sismatic-store-memory = { workspace = true }
sismatic-sync = { workspace = true, features = ["driver"] }

#  Third-party dependencies
anyhow.workspace = true
# The store's ports are async traits, and the root implements one of them:
# `status::RegistryStatus` is the adapter that cannot live in
# `sismatic-store-memory`, because it reads a `sismatic-core` registry.
async-trait.workspace = true
# The write side's `Stamp`: the root is where a fresh command id and the instant
# it was accepted are minted, so that `sismatic-http-api` needs neither a UUID
# generator nor a clock and its handlers stay pure functions of their
# extractors.
chrono.workspace = true
uuid.workspace = true
clap = { workspace = true, features = ["derive"] }
config = "0.15.25"
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing = { workspace = true, features = ["log"] }
tracing-bunyan-formatter.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true
sismatic-intent-relay.workspace = true

[dev-dependencies]
# `sync` for the oneshot the end-to-end test shuts `run` down with — the library
# itself takes shutdown as a plain future and needs no channel of its own.
tokio = { workspace = true, features = ["sync"] }
