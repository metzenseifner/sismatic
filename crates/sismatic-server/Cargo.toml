[package]
name = "sismatic-server"
version.workspace = true
edition.workspace = true
license.workspace = true
# The composition-root binary: internal, published nowhere (release-plz.toml
# already carries `release = false` for it). The flag is not merely
# documentation — it is load-bearing. `cargo publish --workspace` skips
# `publish = false` members, and the members it skips are also absent from the
# local overlay that satisfies the other members' path+version deps. So a
# *publishable* crate may not depend on an unpublishable one: cargo strips the
# `path`, resolves the leftover `version` against crates.io, and fails with
# "no matching package named `sismatic-http-api` found". Marking this crate
# unpublishable pulls it out of the publish set entirely, which is the only way
# it may keep depending on `sismatic-http-api` (itself `publish = false`).
# Invariant: publish = false is contagious upward — every crate that depends on
# an unpublished crate must be unpublished too.
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "sismatic-server"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
config = "0.15.25"
serde.workspace = true
# `toml`/`yaml` give the composition root core's extension-dispatching
# `config::load`, so `devices_config_path` may name either format.
sismatic-core = { version = "0.2.23", path = "../sismatic-core", features = [
  "ssh",
  "toml",
  "yaml",
] }
# The read side. It sees only the store, so linking it here does not widen the
# composition root's cone — the root already depends on everything it joins.
sismatic-http-api = { version = "0.2.23", path = "../sismatic-http-api" }
sismatic-store = { version = "0.2.23", path = "../sismatic-store" }
sismatic-store-memory = { version = "0.2.23", path = "../sismatic-store-memory" }
# The composition root drives the write side, so it needs the `driver` feature
# (the poll loops), not just the pure `dto` seam.
sismatic-sync = { version = "0.2.23", path = "../sismatic-sync", features = [
  "driver",
] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing = { workspace = true, features = ["log"] }
tracing-bunyan-formatter.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# `sync` for the oneshot the end-to-end test shuts `run` down with — the library
# itself takes shutdown as a plain future and needs no channel of its own.
tokio = { workspace = true, features = ["sync"] }
