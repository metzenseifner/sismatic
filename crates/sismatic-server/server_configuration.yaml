# Where the fleet comes from, and where runtime changes to it go.
#
# `config_path` is the devices file, relative to this file's directory. Its
# contents are not read once: `POST /v1/inventory/config/reset` re-reads it, and
# the `/v1/inventory` routes can change the fleet without touching it at all.
#
# `runtime_config_path` is commented out, which is the default and the one most
# deployments want: with nothing persisted, the devices file is unambiguously
# authoritative and a restart returns to exactly what it says.
#
# Uncomment it to make a fleet edited through the API survive a restart — and
# know what that buys. The file then *wins at startup*, so an edit to
# `devices.yaml` has no effect until a reset adopts it; the server warns on every
# startup that loads from it, naming both paths. It also carries device
# credentials, necessarily, since it exists to be loadable.
inventory:
  config_path: devices.yaml
  # runtime_config_path: devices.state.yaml

intent_relay:
  poll_ms: 250
  max_attempts: 3

sync:
  interval_secs: 30
  fields:
    - "*"
    - name: RUNNING_STATE
      interval_secs: 5
    - name: MAC_ADDRESS
      interval_secs: 0

# What the store keeps, and how much of the machine it may use.
#
# `retain` accepts a rolling window (30d, 2 weeks, 1h 30min), a fixed floor
# (2026-01-01T00:00:00Z, or a bare 2026-01-01 read as midnight UTC), or
# `forever`. A rolling window is what a deployment normally wants: it is the
# only form whose memory cost stops growing.
#
# `max_memory` is the backstop, and it is the setting that keeps an unattended
# server alive — the bytes a retention window costs depend on the fleet size and
# the poll schedule above, which is not something the person writing `retain`
# is holding in their head. It is enforced on every write, not at each cleanup,
# so it holds between sweeps. `unlimited` removes it, at the deployment's own
# risk.
#
# `cleanup_interval` is how often expired reads are actually deleted, so it is
# also how far past `retain` one can linger. `never` (or 0) starts no sweeper.
store:
  retain: 24h
  cleanup_interval: 5min
  max_memory: 256MiB

http:
  host: 127.0.0.1
  port: 9000
