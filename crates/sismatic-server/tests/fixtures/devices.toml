# Fixture device pool for tests/server_checks.rs. Never connected to: the tests
# assert on the resolved config, and `run` only opens a connection when a poll
# loop fires, which the immediate shutdown prevents.
[defaults]
username = "admin"
password = "extron"

[[device]]
id = "atrium-a"
host = "10.0.0.7"

[[device]]
id = "atrium-b"
host = "10.9.40.12"

[[device]]
id = "audimax-a"
host = "10.10.40.12"

[[device]]
id = "audimax-b"
host = "10.10.40.13"

[[device]]
id = "lecture-hall-1-a"
host = "10.10.40.14"

[[device]]
id = "lecture-hall-1-b"
host = "10.10.40.14"

[[group]]
id = "atrium"
devices = ["atrium-a", "atrium-b"]

[[group]]
id = "audimax"
devices = ["audimax-a", "audimax-b"]

[[group]]
id = "lecture-hall-1"
devices = ["lecture-hall-1-a", "lecture-hall-1-b"]
