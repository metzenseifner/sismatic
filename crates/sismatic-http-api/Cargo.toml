[package]
name = "sismatic-http-api"
description = "The read side of Sismatic: an actix-web application over the store's ReadStore port."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
actix-web.workspace = true
# `openapi` turns on the DTOs' `ToSchema`/`IntoParams` derives. This crate is the
# only place that needs them: it is where the schemas are assembled into a
# document and served, and the contract crate has no opinion about HTTP.
sismatic-api-types = { workspace = true, features = ["openapi"] }
sismatic-store = { workspace = true }
# One request body of this crate's own (`routes::commands::ValueWrite`). Every
# other type on the wire comes from `api-types`, which derives its own.
serde.workspace = true
# The `#[utoipa::path]` attributes on the handlers and the `OpenApi` derive that
# collects them — see `src/openapi.rs`.
utoipa.workspace = true
# Serves the browsable UI over the document above. Its `actix-web` feature makes
# `SwaggerUi` an actix `HttpServiceFactory`, so it mounts with `.service()` like
# any other route rather than needing a static-file handler wired by hand.
utoipa-swagger-ui.workspace = true

[dev-dependencies]
# Needed to implement `ReadStore` for the test doubles in `tests/` — the store
# port is an async trait.
async-trait.workspace = true
reqwest = { workspace = true, features = ["json"] }
# The tests drive a real server, so they need a runtime and `#[tokio::test]`.
# `rt` (current-thread) is enough: actix runs its workers on their own threads,
# and the test's runtime only has to poll the client and the server handle.
tokio = { workspace = true, features = ["macros", "rt"] }
# The response-body assertions read the JSON as values rather than re-deriving
# the DTOs, so a test pins the bytes on the wire and not just a round-trip.
serde_json.workspace = true
# The readings tests run the handlers over the *real* in-memory adapter rather
# than a hand-written double. A double would have to restate the port's ordering
# and filtering semantics, and a test of a handler over a double that drifted
# from the adapter would pass while the server was wrong. A dev-dependency, so
# nothing about the shipped crate's dependency cone changes.
sismatic-store-memory = { workspace = true }
