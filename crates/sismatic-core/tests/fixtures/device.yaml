# Initial state of the simulated Extron SMP.
#
# Every key is a field name from the instruction catalogs
# (`Query` ∪ `Register` ∪ `Setting`), matched case- and `-`/`_`-insensitively
# through the same `FromStr` the client uses. `simulator_config.rs` asserts this
# file covers the catalog exactly, so adding an instruction fails a test until a
# value lands here.
#
# Values are the device's *wire text* — what it would put on the channel, minus
# the CR LF terminator. There is no per-field type table: a value is well-formed
# iff the production parser accepts it. YAML integers and booleans are
# normalised (`true` -> "1"), so flags and ports read naturally.
#
# The starting state only — writes and recording commands mutate it at runtime.
#
# Check it without starting a server:
#   cargo run -p sismatic-core --features simulator --bin simulated-device -- --check-config

username: admin
password: extron

# --- license ------------------------------------------------------------
# What this unit admits to having. Not state: no request changes it, and a
# vetoed field is *refused* (a bare `E<code>` line) rather than answered or left
# silent — a distinction the client turns on, so simulating it is the point.
#
# `licensed_streams` is the Extron-shaped way to say it: 1 is Archive Channel A,
# 2 is Archive Channel B (Dual Mode), 3 is Confidence. A subset vetoes every
# field addressing a stream outside it — `STREAM_2_NAME`, `RTMP_2_URL`,
# `RTMP_BACKUP_STREAM_2_LIVE_STATE` and the rest — because the index is read out
# of the field name rather than listed here.
#
# A fully-loaded unit, so the drift guards check the whole catalog. For a base
# unit, edit this or override it on the command line:
#
#   simulated-device --licensed-streams 1
#
licensed_streams: [1, 2, 3]
# Anything else this unit refuses, one field at a time — the device-side mirror
# of the client's `disabled_fields`.
unlicensed_fields: []
# The code a refusal answers with. 13 is "invalid parameter (number is out of
# range)", which is what an unlicensed stream is on the wire.
refusal_code: 13

fields:
  # --- identity, read-only ------------------------------------------------
  FIRMWARE: "3.06"
  MODEL_NAME: SMP 351
  MODEL_DESCRIPTION: Streaming Media Processor
  PART_NUMBER: 60-1324-01
  MAC_ADDRESS: 00-05-a6-01-02-03
  UNIT_NAME: Main Hall SMP

  # --- recording ----------------------------------------------------------
  # 0 stopped, 1 started, 2 paused. Rewritten by START/STOP/PAUSE at runtime.
  RUNNING_STATE: 0
  # An empty list. Populated as `<name:video_loss,level:critical>*<name:...>`.
  ACTIVE_ALARMS: ""
  # The recorder's own table, and the one field whose reply is a *list* rather
  # than a line — so it is written as a document rather than as wire text. The
  # loader renders it back to the device's framing (one JSON object per line,
  # the list terminated by a blank one), which is why the drift guards can feed
  # it to the real parser like any other field.
  #
  # `recording_events: []` is a recorder that has never recorded. For a longer
  # table than belongs in a config, name a file holding the same document:
  #
  #   RECORDING_EVENTS:
  #     file: ./recordings.json
  #
  RECORDING_EVENTS:
    recording_events:
      # A complete row, as a current firmware reports one. `media_present`
      # really does arrive as the string "true"; a JSON boolean is accepted too.
      - db_id: 1
        start: 1767879511
        identifier: sim-smp-351_20260108-143831
        creator: c900011
        title: Lecture 1
        state: 11
        media_present: "true"
        package: /var/internal/sim-smp-351_20260108-143831
      # A sparse row: the fields a firmware may simply not report are absent
      # rather than zeroed, which is the distinction `Option` exists to carry.
      - db_id: 2
        start: 1767883456
        identifier: sim-smp-351_20260108-154417
        package: /var/internal/sim-smp-351_20260108-154417

  # --- network ------------------------------------------------------------
  TELNET_PORT: 23
  SSH_PORT: 22023
  HTTP_PORT: 80
  HTTPS_PORT: 443
  SNMP_PORT: 161
  DHCP_MODE: false
  TIMEZONE: Europe/Vienna
  # Tens of seconds: 30 => 300 seconds.
  PORT_TIMEOUT: 30
  GLOBAL_PORT_TIMEOUT: 30

  # --- SNMP ---------------------------------------------------------------
  SNMP_STATE: true
  SNMP_UNIT_LOCATION: Main Hall, Building A
  SNMP_UNIT_CONTACT: av-team@example.edu
  SNMP_PUBLIC_COMMUNITY_STRING: public
  SNMP_PRIVATE_COMMUNITY_STRING: private

  # --- metadata registers -------------------------------------------------
  # Read/write: in `Query` and `Register`, so one cell serves both.
  CONTRIBUTOR: A. Contributor
  COURSE: PHYS 101
  COVERAGE: Semester 1
  DESCRIPTION: Simulated recording for integration tests
  FORMAT: video/mp4
  LANGUAGE: en
  PRESENTER: A. Presenter
  PUBLISHER: Example University
  RELATION: ""
  RIGHTS: CC BY 4.0
  SOURCE: Main Hall camera
  SUBJECT: Physics
  SYSTEMNAME: sim-smp-351
  TITLE: Lecture 1
  TYPE: MovingImage

  # Read-only: in `Query` but not `Register`.
  DATE: 2026-08-11
  IDENTIFIER: urn:sismatic:sim-001

  # --- streams ------------------------------------------------------------
  # Read/write: in `Query` and `Setting`, so one cell serves both. Whether this
  # unit *has* a stream is the license block above, not a value here; these are
  # what it answers when it does.
  STREAM_1_NAME: Archive Channel A
  STREAM_2_NAME: Archive Channel B
  STREAM_3_NAME: Confidence
  STREAM_1_STATE: true
  STREAM_2_STATE: false
  STREAM_3_STATE: false

  # --- RTMP push targets --------------------------------------------------
  # Write-only: in `Setting` but not `Query`, because SIS offers no read of a
  # push URL or of an enable flag. With no parser to decode them, the drift net
  # can only check that they are *present*, which is why
  # `write_only_settings_are_exactly_the_attested_rtmp_hole` pins them as a
  # deliberate hole.
  RTMP_1_URL: rtmp://cdn.example.edu/live/hall-a
  RTMP_1_BACKUP_URL: rtmp://backup.example.edu/live/hall-a
  RTMP_2_URL: rtmp://cdn.example.edu/live/hall-b
  RTMP_2_BACKUP_URL: rtmp://backup.example.edu/live/hall-b
  RTMP_3_URL: rtmp://cdn.example.edu/live/confidence
  RTMP_3_BACKUP_URL: rtmp://backup.example.edu/live/confidence
  RTMP_1_STATE: true
  RTMP_2_STATE: false
  RTMP_3_STATE: false

  # Read-only: whether a push is on air. Arming a stream is the write above;
  # what puts it on air is a scheduled session this protocol does not reach, so
  # live state is a read with no write to pair with.
  RTMP_STREAM_1_LIVE_STATE: true
  RTMP_STREAM_2_LIVE_STATE: false
  RTMP_STREAM_3_LIVE_STATE: false
  RTMP_BACKUP_STREAM_1_LIVE_STATE: false
  RTMP_BACKUP_STREAM_2_LIVE_STATE: false
  RTMP_BACKUP_STREAM_3_LIVE_STATE: false
