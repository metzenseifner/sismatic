[package]
name = "sismatic-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sismatic-core = { workspace = true }
sismatic-api-types = { workspace = true }
sismatic-store = { workspace = true, optional = true }
# Third-party dependencies
tokio = { workspace = true, features = [
  "macros",
  "rt",
  # The `watch` channel the poll schedule arrives on: the driver's supervisor
  # holds a receiver, and whoever changes the config holds the sender.
  "sync",
  "time",
], optional = true }
tokio-util = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# The driver's tests drive real poll loops over core's test doubles
# (`CountingConnector`/`FakeTransport`, behind core's `testing` feature) and
# record what reaches the store, so they need no network and no real store.
async-trait.workspace = true
sismatic-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[features]
default = []
# The keep-in-sync poll loops: `spawn`, `SyncConfig`, `SyncHandle`.
driver = [
  "dep:sismatic-store",
  "dep:tokio",
  "dep:tokio-util",
  "dep:chrono",
  "dep:tracing",
  "sismatic-core/ssh",
]
