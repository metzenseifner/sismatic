name: release-plz

# Owns the Cargo half of releasing (see release-plz.toml): opens the version-bump
# / changelog "release PR", and on its merge publishes sismatic-core to crates.io
# and pushes a `v{version}` tag. That tag is the handoff to pipeline.yml, which
# builds the wheels and publishes them to PyPI.
on:
  push:
    branches: [main]

# release-plz needs to open PRs and push commits/tags.
permissions:
  contents: write
  pull-requests: write

# At most one release-plz run acts on a given ref at a time. Both jobs below
# decide what to do by comparing the version in the checked-out tree against the
# tags visible in *that clone* — a reading that is only correct if no sibling run
# is concurrently moving the tags.
#
# Two merges 14s apart on 2026-08-25 raced exactly there. Merging release PR #41
# and then PR #40 started two runs; the second one's checkout fetched tags one
# second before the first one pushed `v0.3.1`. Since #40 merged on top of the
# release PR, its tree already carried version 0.3.1, so under git_only the
# second run saw "version 0.3.1, no such tag", built the tag, and died on
# `422 Reference already exists` — a no-op release that reddened main and, via
# the `needs:` below, skipped the release PR for #40 until the next push.
#
# `cancel-in-progress: false` keeps one run pending and cancels a superseded
# middle one. That is safe here: each job's decision is a pure function of tree
# version vs. tags, so a later run always subsumes a cancelled earlier one — if
# the cancelled run would have created a tag, the next one recomputes and
# creates it. The cost is that a merge landing behind a release-PR merge waits
# out that run's release-pr job.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Keeps a single open "release PR" up to date with the pending version bump +
  # changelog. Nothing is published here.
  release-plz-pr:
    name: Release PR
    runs-on: ubuntu-latest
    # Ordered *after* the release job, which is the one that pushes the
    # `v{version}` tag this job needs: under git_only, release-plz diffs each
    # member against a worktree checked out at the last tag. Upstream's example
    # workflow leaves the two jobs parallel, and on the one push where it matters
    # — the merge of a release PR, when a new tag is being created — they race.
    # It bit us on the 0.2.25 merge: this job read v0.2.24, packaged that tree,
    # and died one second before the release job pushed v0.2.25. When the stale
    # tag does package, the race is quieter but not harmless: the diff baseline
    # is one release behind, so this job can re-propose changes that just
    # shipped. `fetch-depth: 0` below then picks up the tag the release job made.
    #
    # Note this skips the job if the release job fails — deliberate: a release PR
    # computed off a failed release is worse than no PR. It cannot skip a
    # *release*, since that job still runs first and unconditionally.
    needs: release-plz-release
    steps:
      # Mint a token from the GitHub App (APP_ID / APP_PRIVATE_KEY secrets). Used
      # instead of the default GITHUB_TOKEN so the release PR — and later the tag
      # — can trigger pipeline.yml. Must run before checkout, which consumes it.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      # cargo must be on PATH for release-plz to read metadata / publish. core's
      # default features pull in no native deps, so a plain toolchain is enough
      # (no Nix needed for this workflow).
      #
      # Deliberately NOT the project's pinned toolchain. This job builds no
      # shipping artifact; it runs release-plz, whose version determination
      # shells out to cargo-semver-checks, which reads rustdoc JSON — a format
      # tied to the compiler, so it enforces its own rustc floor that moves with
      # upstream. Pinning that to our MSRV couples two versions with no reason
      # to agree, and on 2026-09-16 they stopped agreeing (run 35062233853):
      #
      #     error: rustc version is not high enough: >=1.93.0 needed, got 1.92.0
      #
      # Nothing in the tree had changed. `release-plz/action` defaults its
      # `version` input to whatever was latest when the action tag was cut, so
      # `@v0.5` floats the CLI: 0.3.162 (green, 2026-09-08) became 0.3.167,
      # which bundles a cargo-semver-checks wanting rustc >= 1.93. Against a
      # pinned 1.92.0 that made a calendar event red main.
      #
      # Both pins below are load-bearing. `version` stops the CLI floating, so
      # an upstream release can no longer break main without a commit here.
      # RUSTUP_TOOLCHAIN — not the action pin — is what actually selects the
      # compiler: rustup ranks the env var (2) above a rust-toolchain.toml
      # directory override (4) and above the default toolchain the action sets
      # (5), so ./rust-toolchain.toml would otherwise win and the action pin
      # would be decorative.
      #
      # Which rust-toolchain.toml governs is worth stating, because the answer
      # resembles the tag-wedge failure documented in release-plz.toml.
      # cargo-semver-checks is run against a worktree checked out at the last
      # tag, carrying *that tag's* rust-toolchain.toml — if that file governed,
      # main could never fix itself, since the tag only moves via the release PR
      # this job opens. It does not govern: release-plz spawns the tool with no
      # current_dir (release_plz_core/src/semver_check.rs), the rustc gate is
      # rustc_version::version() in that inherited cwd (cargo-semver-checks
      # src/lib.rs), and both rustdoc builds are driven by --manifest-path
      # rather than a chdir. Everything resolves against this checkout — and the
      # env var outranks all of it regardless.
      #
      # `stable` is a deliberate float, in the one direction cargo-semver-checks
      # always wants. Its only failure mode is the crate ceasing to compile on a
      # new stable, and this job is advisory: it proposes a version bump, it
      # never publishes. Pin it to an explicit version if that trade changes.
      - uses: dtolnay/rust-toolchain@stable
      - name: release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          version: 0.3.167
        env:
          RUSTUP_TOOLCHAIN: stable
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # On merge of the release PR (or any push where Cargo's version is ahead of
  # crates.io), publishes sismatic-core and pushes the `v{version}` tag.
  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      # `stable` + the two pins below, for the reasons spelled out on the
      # release-pr job above. Keep the three values in sync across both jobs:
      # they must agree, since either job reaching cargo-semver-checks on a
      # rustc below its floor fails the same way.
      - uses: dtolnay/rust-toolchain@stable
      - name: release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
          version: 0.3.167
        env:
          RUSTUP_TOOLCHAIN: stable
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
