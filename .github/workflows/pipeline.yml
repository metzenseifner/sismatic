name: Build & Release

# Every step below is an output of flake.nix and runs identically on a laptop:
#   nix build .#deps                    # the shared dependency layer
#   nix build .#checks.<system>.<name>  # one check (`nix flake check` = all)
#   nix build .#server-release          # publishable sismatic-server tarball
#   nix run   .#build-wheel             # portable wheel (manylinux_2_28 via zig)
#   nix run   .#build-sdist             # source distribution
# This workflow is only a dispatcher: it installs Nix (./.github/actions/nix)
# and invokes those outputs. No build logic lives here.
#
# Shape: `nix flake check` builds every check sequentially on one machine, which
# is why it grew to ~16 minutes. Here the dependency layer is built once by the
# `deps` job and the checks then fan out one-per-runner, turning that sum into a
# max. The matrix is read out of the flake itself, so adding a check to
# flake.nix adds a CI job with no edit to this file.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # cache-nix-action deletes superseded Nix store caches by prefix. Without this
  # the delete API 403s, stale entries accumulate, and the repo's 10 GB budget
  # starts evicting the caches that are actually load-bearing.
  actions: write

# Supersede in-flight PR runs on a new push; never cancel main/tag builds
# (those may be producing a release).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Seeds the x86_64-linux Nix store cache and enumerates the check set.
  # Everything in the `check` matrix restores that cache read-only, so the
  # expensive Cargo.lock-keyed dependency layer is compiled at most once per
  # lockfile change rather than once per job.
  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      checks: ${{ steps.enumerate.outputs.checks }}
      system: ${{ steps.nix.outputs.system }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix
        id: nix
        with:
          family: check
          save: "true"

      # Evaluation-only sweep of every flake output. The matrix below builds
      # the checks but never looks at packages, apps or devShells, so this is
      # what catches an output that no longer evaluates.
      - name: Evaluate flake
        run: nix flake check --no-build --print-build-logs

      # The layer every check builds on, so no matrix cell below has to compile
      # it itself. On an unchanged Cargo.lock this is a cache hit and a no-op.
      - name: Build dependency layer
        run: nix build .#deps --no-link --print-build-logs

      - name: Enumerate checks
        id: enumerate
        run: |
          checks=$(nix eval --json ".#checks.${{ steps.nix.outputs.system }}" \
            --apply builtins.attrNames)
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          echo "$checks"

  # One runner per check, restoring the store the `deps` job just seeded.
  check:
    name: ${{ matrix.check }}
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.deps.outputs.checks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix
        with:
          family: check
      - name: nix build .#checks.${{ matrix.check }}
        run: |
          nix build ".#checks.${{ needs.deps.outputs.system }}.${{ matrix.check }}" \
            --no-link --print-build-logs

  # The default package (the `sismatic` CLI) as a release asset, unchanged from
  # the pre-split pipeline. Kept in its own job rather than folded into `deps`
  # so it stays off the critical path the check matrix waits on; it restores
  # the store `deps` seeded, so the build itself is just the CLI crate.
  crate:
    name: Crate
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix
        with:
          family: check

      - name: Build crate
        run: nix build .# --out-link result-crate --print-build-logs

      - name: Stage crate
        run: |
          mkdir -p out/crate
          cp -Lr result-crate/. out/crate/
      - uses: actions/upload-artifact@v4
        with:
          name: crate
          path: out/crate/**
          if-no-files-found: error

  # Publishable sismatic-server binaries: one native runner per architecture, so
  # nothing is cross-compiled and aws-lc-sys keeps its native cmake path. What
  # "portable" means per platform (statically linked musl on Linux, a rewritten
  # libiconv load command on macOS), what the tarball is called and what goes
  # in it are all decided by `.#server-release` — this job only uploads it.
  binaries:
    name: Server ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-linux }
          - { runner: ubuntu-24.04-arm, target: aarch64-linux }
          # - { runner: macos-15-intel, target: x86_64-darwin }
          - { runner: macos-14, target: aarch64-darwin }
    steps:
      - uses: actions/checkout@v4
      # One job per architecture in this family, so each is its own seeder and
      # no two jobs ever race on the same key.
      - uses: ./.github/actions/nix
        with:
          family: dist
          save: "true"
          max-store-size: 4G

      - name: Build server release
        run: nix build .#server-release --out-link result-server --print-build-logs

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: result-server/*
          if-no-files-found: error

  # Portable wheels: one native runner per platform, each running the same
  # `nix run .#build-wheel`. The cargo cache below keeps repeat runs from
  # recompiling aws-lc-sys (pulled in by russh) from scratch.
  wheels:
    name: Wheel ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu = x86_64 linux, macos-15-intel = x86_64 macOS,
        # macos-14 = aarch64 macOS.
        runner: 
          - ubuntu-latest
          - ubuntu-24.04-arm
          # - macos-15-intel
          - macos-14
    steps:
      - uses: actions/checkout@v4
      # Restore-only: the `binaries` job owns this family's cache on each of
      # these architectures, and the two run concurrently.
      - uses: ./.github/actions/nix
        with:
          family: dist

      # Nix caches the toolchain/maturin/zig/cmake; this caches the *cargo*
      # build (crates + target/), so aws-lc-sys is only compiled once per
      # platform+lockfile. Keyed by runner (not runner.os) to keep the two
      # macOS archs separate.
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: wheel-cargo-${{ matrix.runner }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            wheel-cargo-${{ matrix.runner }}-

      - name: Build portable wheel
        run: nix run .#build-wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.runner }}
          path: dist/*.whl
          if-no-files-found: error

  # The purge cache-nix-action performs for its own families, done by hand for
  # the one cache that is plain actions/cache. actions/cache never deletes
  # anything: every Cargo.lock change mints a new key and the superseded entry
  # sits there until GitHub's 10 GB LRU evicts *something* — quite possibly one
  # of the multi-gigabyte Nix caches instead, turning a stale 300 MB cargo
  # directory into a 15-minute rebuild somewhere else.
  #
  # Runs as its own job rather than a step inside `wheels` because `needs`
  # waits for the whole job including post steps, which is where actions/cache
  # writes. By the time this runs the current key is already saved, so it
  # cannot delete the entry the run just produced. For the same reason it must
  # NOT be `if: always()` — actions/cache does not save on a failed job, so
  # pruning after a failure would delete the old entry and leave nothing.
  prune-cargo-cache:
    name: Prune cargo caches
    needs: wheels
    # Forks get a read-only GITHUB_TOKEN, so they can neither write caches nor
    # delete them. Nothing to prune, and the API would 403.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Step-level so it evaluates after checkout — hashFiles reads the
      # workspace, and at job level there is nothing there yet.
      - name: Delete superseded wheel-cargo caches
        env:
          GH_TOKEN: ${{ github.token }}
          # Must match the wheels job's key suffix exactly. Every runner shares
          # this hash (same two files), so one value covers the whole matrix.
          KEEP: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        run: |
          set -euo pipefail

          # Scoped to this run's ref, and that scoping is load-bearing: caches
          # belong to a ref (refs/heads/<branch>, or refs/pull/<n>/merge for a
          # PR) and keys differ per lockfile, so an unscoped prefix sweep run
          # from a PR would happily delete main's live caches.
          gh cache list --key wheel-cargo- --ref "$GITHUB_REF" --limit 100 \
            --json id,key --jq '.[] | [.id, .key] | @tsv' > caches.tsv

          while IFS=$'\t' read -r id key; do
            case "$key" in
              *"$KEEP")
                echo "keep    $key"
                ;;
              *)
                echo "delete  $key"
                # Non-fatal: concurrent runs on the same ref can race and turn
                # this into a 404. Losing a janitor's delete is not worth
                # failing a green pipeline over.
                gh cache delete "$id" \
                  || echo "::warning::could not delete cache $key"
                ;;
            esac
          done < caches.tsv

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix
        with:
          family: dist

      - name: Build sdist
        run: nix run .#build-sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # The single required status check on `main` (ruleset: protect-trunk).
  #
  # The jobs above fan out into names that cannot be enumerated in a branch
  # ruleset: the `check` matrix reads its names out of flake.nix at run time, so
  # a hand-typed list in the ruleset would go stale on the next flake edit — and
  # stale in the dangerous direction, since a newly added check could fail while
  # the ruleset kept watching only the names it already knew. This job collapses
  # all of them into one stable context, "All checks passed", which is the only
  # name the ruleset has to know.
  #
  # `release` and `publish-pypi` are deliberately absent: both are refs/tags/
  # only and would be permanently `skipped` on a pull request.
  #
  # Consequence to keep in mind: `pipeline.yml` must never grow a `paths:`
  # filter. A required check that does not run is not "passed", it is *pending*,
  # and the PR becomes unmergeable forever. Skip work at the step level instead.
  gate:
    name: All checks passed
    # Must run even when a dependency fails. Without this the job is skipped on
    # any red job, the required check never reports, and the PR blocks on a
    # check that will never arrive.
    if: always()
    needs: [deps, check, crate, binaries, wheels, sdist, prune-cargo-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every dependency succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<<"$NEEDS" | sort
          # `skipped` is tolerated: prune-cargo-cache skips itself on fork PRs
          # by design. `cancelled` is not — a cancelled job proved nothing.
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' \
               <<<"$NEEDS" >/dev/null; then
            echo "::error::one or more pipeline jobs did not succeed"
            exit 1
          fi

  # On a v* tag, gather every artifact and attach it to a GitHub Release.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, crate, binaries, wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The server tarballs already carry their version and target triple (the
      # flake names them) and ship next to a .sha256, so they are copied
      # through untouched.
      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.sha256' \) \
            -exec cp -n {} release/ \;
          if [ -d artifacts/crate ]; then
            tar -czf "release/sismatic-crate-${GITHUB_REF_NAME}.tar.gz" \
              -C artifacts/crate .
          fi
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  # On a v* tag, ship the built wheels + sdist to PyPI. Inlined here rather than
  # split into a reusable workflow: PyPI's PEP 740 attestation records this file
  # (the top-level workflow_ref) as its Build Config URI, so publishing from a
  # reusable workflow makes that identity disagree with the OIDC
  # job_workflow_ref and PyPI rejects the upload. Keeping it inline means both
  # the OIDC auth and the attestation resolve to pipeline.yml — configure
  # sismatic's PyPI Trusted Publisher to this file (pipeline.yml) and the `pypi`
  # environment below.
  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/sismatic/
    permissions:
      # Required for Trusted Publishing (OIDC) and PEP 740 attestations.
      id-token: write
    steps:
      # Wheels + sdist were uploaded earlier in this same run, so no run-id is
      # needed — download-artifact pulls them straight from the current run.
      - name: Download pipeline artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Gather only the Python distributions. The pipeline also uploads the
      # sismatic-server tarballs and a crate tarball, neither of which is a
      # PyPI artifact.
      - name: Collect wheels + sdist
        run: |
          mkdir -p dist
          find artifacts \( -name '*.whl' -o -name '*.tar.gz' \) \
            -not -name 'sismatic-server-*' -not -name '*crate*' \
            -exec cp -n {} dist/ \;
          echo "Files to publish:"
          ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true
