site_name: sismatic
site_description: Blocking Python facade for driving Extron SIS devices over SSH
site_url: https://metzenseifner.github.io/sismatic/
repo_url: https://github.com/metzenseifner/sismatic
repo_name: metzenseifner/sismatic

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # griffe loads the `sismatic` package from the SDK crate's Python
          # layer. There is no Python source for the compiled module — only the
          # `__init__.pyi` stub — so griffe reads the stub statically and renders
          # the API from it. No wheel build required to generate docs.
          paths: [crates/sismatic-python-sdk/python]
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  # `--8<-- "env-reference.md"` in deployment.md. That table is generated from
  # the server's config type by `nix build .#env-reference` and dropped into
  # docs/ by the `docs` app, so it is included rather than committed — a
  # committed copy is a second source of truth that only a human notices has
  # gone stale.
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Deployment: deployment.md
  - API Reference: reference.md

# env-reference.md is a fragment that deployment.md pulls in, not a page of its
# own. Naming it here is how mkdocs is told that, rather than reporting it on
# every build as a page somebody forgot to link.
not_in_nav: |
  env-reference.md

# container-docs.md is excluded outright, where env-reference.md above is
# merely absent from the nav, and the difference is that one of them is a
# document and the other is a template. `not_in_nav` silences the warning and
# still builds the page; this file would then be served at
# /container-docs/ with its @@PLACEHOLDERS@@ intact, beside the three real
# pages. It is rendered — per registry, with those placeholders substituted —
# by `nix build .#container-docs`, and the registries are the only place it
# is meant to be read.
#
# Snippets and this key are independent: mkdocs excludes the page from the
# build, and pymdownx.snippets reads from the filesystem, so a future page
# could still `--8<--` this one in.
exclude_docs: |
  container-docs.md
