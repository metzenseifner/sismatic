# release-plz owns the *Cargo* half of releasing. On a push to main it opens a
# "release PR" that bumps the shared workspace version and writes CHANGELOGs from
# conventional commits; when that PR merges it pushes a `v{version}` git tag.
#
# Nothing is published to crates.io — not sismatic-core, not anything else. No
# sismatic crate has ever existed there. `publish = false` in [workspace] below
# is the single gate that enforces that, and it is the *only* place that decision
# is made. Do NOT re-express it as `publish = false` in a member's Cargo.toml:
# for any member another member depends on, that breaks releases outright (see
# the "publishable dependency" rule below).
#
# The PyPI half is deliberately NOT modeled here, and doesn't need to be. The
# version has a single source of truth — `[workspace.package] version` in
# Cargo.toml — which maturin reads via `dynamic = ["version"]` and flake.nix
# reads at flake.nix:95. So bumping Cargo.toml propagates to the wheel, sdist and
# Nix outputs for free, and the `v*` tag release-plz pushes is exactly what
# .github/workflows/pipeline.yml triggers on to build wheels + publish to PyPI.
#
# Handoff requires the tag push to trigger CI. Tags pushed with the default
# GITHUB_TOKEN do NOT start other workflows, so the release-plz workflow uses a
# PAT / GitHub App token (see .github/workflows/release-plz.yml).

[workspace]
# Derive versions from git tags instead of the cargo registry. This is the
# crux of why release-plz works here at all: none of these crates are published
# to crates.io, so the default registry-based version detection finds no prior
# version, can't compute a bump, and just echoes whatever is already in
# Cargo.toml — never opening a release PR. With `git_only`, release-plz reads the
# last `v{version}` tag as the baseline and bumps from the conventional commits
# since it.
#
# The "publishable dependency" rule. git_only makes release-plz run `cargo
# package` over every member to diff it against the last tag, and that imposes
# two constraints that together are easy to get wrong:
#
#   1. Every internal path dependency must carry a `version` — `cargo package`
#      refuses a path dependency with no version requirement.
#   2. Every member that another member depends on must be *publishable*, i.e.
#      must NOT set `publish = false` in its own Cargo.toml. Cargo rewrites the
#      versioned path dependency from (1) into a registry dependency and resolves
#      it, substituting the locally packaged sibling only when that sibling is
#      publishable. An unpublishable sibling sends cargo to crates.io, where no
#      sismatic crate exists, and the release-pr job dies with "no matching
#      package named <crate> found".
#
# Constraint (2) is counter-intuitive — the crates that must look publishable are
# exactly the ones we never publish — and getting it wrong fails at release time,
# not build time, on whichever member happens to be packaged first. Both
# constraints are asserted statically by `nix flake check` (flake.nix:
# internal-version-pins and internal-deps-publishable), so a violation surfaces
# on the PR rather than after merge. `publish = false` is fine on leaf members
# nothing else depends on: the CLI/web/server binaries and the pyo3 cdylib.
git_only = true
# Default publishing and tagging OFF for every member; sismatic-core opts back
# into tagging below and nothing opts into publishing. This is what keeps the
# CLI/web binaries and the pyo3 cdylib from ever being pushed to crates.io or
# tagged by accident — note that it is independent of `release`, which is on
# everywhere (see below) and governs version determination, not publication.
publish = false
git_tag_enable = false
# pipeline.yml is the single owner of the GitHub Release (it attaches the wheels,
# sdist and crate tarball). release-plz only needs to publish + tag, so it does
# not create the release itself.
git_release_enable = false
# One tag for the whole workspace (`v0.2.17`), not per-crate
# `sismatic-core-v0.2.17` tags — this is the pattern pipeline.yml matches.
#
# Carrying no `{{ package }}`, this template matches `v{current}` for *every*
# member under git_only. That is exactly what gives all ten a diff baseline, and
# it is also the one footgun this file has already fired: a crate added *after*
# the last tag matches it too, and release-plz goes looking for that crate in a
# worktree checked out there. That is what wedged main when sismatic-intent-relay
# landed: `Failed to find package "sismatic-intent-relay"`, unrecoverable,
# because the tag only moves via the release PR that is now failing. The
# two-step procedure for adding a crate is below.
# See docs/Release-Plz-Package-Baselines.md.
git_tag_name = "v{{ version }}"

# Every member is released (`release` defaults to true), and every member
# therefore keeps the workspace-shaped template above. Both halves of that are
# deliberate, and the reason is "a change anywhere must produce a version".
#
# How release-plz decides a member changed. It attributes a commit to a package
# by asking whether the commit touched that package's *directory* — plus a
# `readme` path pointing outside it, which is the only exception and is a single
# file (`pathbufs_to_check`, release_plz_core). There is no "extra paths" knob.
# So a member only ever votes on the version if it is released, and only on the
# commits that landed inside it.
#
# Why they all need the unscoped template. A scoped `{{ package }}-v{{ version
# }}` matches no tag, so release-plz finds no baseline, logs "will be treated as
# initial release", and walks the member's *entire* history — every old `feat!`
# included. For an unreleased member that is harmless (it never reaches version
# determination). For a released one it would mean a breaking bump on every
# release, forever. Released member <=> unscoped template, enforced below by
# `nix flake check`.
#
# What this costs: measurably almost nothing, and an earlier revision of this
# comment was wrong about it. It claimed ~18 min vs ~2, on the theory that each
# released member pays for its own `cargo package --workspace` run. It does not.
# release-plz caches the reconstructed worktree *per release commit*
# (`reconstructed_workspaces` in next_ver.rs), and the workspace-shaped template
# means all ten members resolve to the same `v{version}` tag — so the packaging
# pass runs once no matter how many members are released. Measured on 0.3.165
# over this workspace at v0.7.1: one `cargo package --allow-dirty --workspace
# --no-verify` (11.5s) and nine cache hits, ~75ms each, 15s for the whole
# `update`. Going from three released members to ten cost about half a second.
#
# The proposed version is also still one number, because `version_group` below
# collapses all ten votes into the highest one, and there is still exactly one
# tag, because `git_tag_enable` stays off everywhere but sismatic-core. What
# does grow is the changelog surface: every member now carries a CHANGELOG.md,
# and a member that saw no commits of its own gets a version bump with no
# changelog entry — which is correct, and is what a shared version means.
#
# Adding a new crate still needs two steps, and the hazard is unchanged — the
# unscoped template above matches `v{current}` for a crate that did not exist at
# that tag, and release-plz dies looking for it in the worktree, unrecoverably,
# because the tag only moves via the release PR that is now failing. So: ship it
# once as `release = false` + scoped, then promote it in a follow-up PR. The
# `expectedReleased` pin in flake.nix is what forces that to be a decision
# rather than an accident; see its assertion message.
#
# One thing deliberately NOT used here: `changelog_include`. It pulls another
# package's commits into this one's diff, and contrary to the docs it does feed
# version determination (`add_commits` runs before the bump is computed), so it
# looks like a way to let one released member speak for an unreleased one. It is
# not: it reads the included member's commit list, which for a baseline-less
# member is that entire-history walk above. Same trap, one level removed.
#
# The frontend is the other half of the guarantee, and it is why
# `http-ui/` lives under crates/sismatic-http-api/ rather than at the repo root:
# a directory outside every package is a directory release-plz cannot see, so
# UI-only commits used to ship with no bump at all. See flake.nix's `httpUi`.
[[package]]
git_tag_enable = true
name = "sismatic-core"
publish = false
version_group = "sismatic"

# `semver_check = false` here and on every member below except sismatic-core.
# None of them can be semver-checked, and none ever has been. The rule is
# mechanical — internal path dependency => the check cannot run — and only
# sismatic-core and sismatic-api-types have none. core keeps the check because
# it has always had it and it has always worked; api-types switches it off,
# which is a decision rather than a consequence, and the entry below says why.
#
# cargo-semver-checks builds the baseline from the *packaged* crate release-plz
# produces under `<worktree>/target/package/`. Packaging rewrites every internal
# path dependency into a registry dependency — the "publishable dependency" rule
# at the top of this file — so packaged sismatic-python-sdk asks crates.io for
# `sismatic-core = "0"`, and packaged sismatic-http-api asks for
# `sismatic-api-types` and `sismatic-store`. No sismatic crate exists there, so
# resolution dies:
#
#     error: no matching package named `sismatic-api-types` found
#
# `cargo package --workspace` *does* substitute local siblings, through a
# temporary local registry at `target/package/tmp-registry` — but only for the
# duration of its own verification pass. cargo-semver-checks resolves later, in a
# throwaway `placeholder` crate of its own, where that source replacement is
# gone. Measured on a two-crate synthetic workspace: same failure, and identical
# under cargo 1.92 and current stable. Structural, not a toolchain regression.
#
# It went unnoticed because release-plz <= 0.3.162 mapped every cargo-semver-
# checks exit code it did not recognise to `Compatible`:
#
#     if stderr.contains("semver requires new major version") { Incompatible }
#     else { Ok(SemverCheck::Compatible) }
#
# So every "sismatic-http-api: ... (✓ API compatible changes)" in this repo's
# history is a false green — the check has never once run to completion. 0.3.167
# (release-plz#3021, "detect cargo-semver-checks failures") turned those exit
# codes into hard errors, which is the only thing that actually changed; it
# stalled the release PR on the 2026-09-17 push.
#
# This flag therefore removes an error, not a guarantee: it makes explicit the
# behaviour the workspace has had all along. Breaking changes in these members
# are still caught the way they always have been — by `!` / BREAKING CHANGE
# markers in conventional commits. sismatic-core deliberately keeps the check,
# and it genuinely works there: core has no internal dependencies, so its
# packaged baseline resolves against crates.io-free input.
#
# `semver_check = false` on sismatic-cli is a no-op today and is set anyway: the
# default is "on for a package containing a library" and the CLI is bin-only, so
# the check never runs — but it depends on sismatic-core, so the day someone
# gives it a `src/lib.rs` it would start failing for the structural reason
# above, in the release PR rather than in the build.
[[package]]
name = "sismatic-python-sdk"
semver_check = false
version_group = "sismatic"

# The remaining members. All released, all on the workspace-shaped template,
# for the reasons at the top of this file. The only axis they differ on is
# whether their packaged baseline can be resolved, i.e. whether they carry an
# internal path dependency.
[[package]]
name = "sismatic-cli"
semver_check = false
version_group = "sismatic"

[[package]]
name = "sismatic-server"
semver_check = false
version_group = "sismatic"

# api-types is the one member that *could* be semver-checked and is not. It has
# no internal path dependency, so by the rule above its packaged baseline would
# resolve — and it is also the member where the check would be worth the most,
# being the shared wire vocabulary. It is off because promoting this member to
# released is a version-determination change, and turning on a check that has
# never once executed in this repo is a different change with a different
# failure mode: cargo-semver-checks is absent locally and crates.io is
# unreachable from the sandbox here, so "it should resolve" is an argument, not
# a measurement, and the place it would be measured for the first time is the
# release PR.
#
# To turn it on, drop the flag in a PR of its own and watch that run. If it
# trips, the flag goes back and nothing else is affected.
[[package]]
name = "sismatic-api-types"
semver_check = false
version_group = "sismatic"

[[package]]
name = "sismatic-sync"
semver_check = false
version_group = "sismatic"

[[package]]
name = "sismatic-store"
semver_check = false
version_group = "sismatic"

[[package]]
name = "sismatic-store-memory"
semver_check = false
version_group = "sismatic"

# `semver_check = false`: the internal path deps sismatic-api-types and
# sismatic-store make this member's packaged baseline unresolvable. Full
# reasoning in the block above the sismatic-python-sdk entry.
#
# This is also the member the frontend belongs to. `http-ui/` is a subdirectory
# of it, so a commit touching nothing but `.tsx` or `.css` is a commit touching
# this package, and votes on the version like any other.
[[package]]
name = "sismatic-http-api"
semver_check = false
version_group = "sismatic"

[[package]]
name = "sismatic-intent-relay"
semver_check = false
version_group = "sismatic"
